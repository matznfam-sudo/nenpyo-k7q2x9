<title>家族の年表</title>
<style>
:root{--bg:#f7efe4;--card:#fff;--ink:#3b2f2a;--sub:#8a7a70;--ac:#d9774f}
@media (prefers-color-scheme:dark){:root{--bg:#211c19;--card:#2d2622;--ink:#f1e7df;--sub:#b3a398;--ac:#f0956c}}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI",sans-serif}
.box{max-width:380px;margin:18vh auto 0;padding:28px 22px;background:var(--card);border-radius:20px;box-shadow:0 6px 24px rgba(0,0,0,.08);text-align:center}
img{width:72px;height:72px;border-radius:16px}
h1{font-size:20px;margin:12px 0 4px}p{color:var(--sub);font-size:14px;margin:4px 0 18px}
input{width:100%;box-sizing:border-box;font-size:18px;padding:12px 14px;border:2px solid #e3d6ca;border-radius:12px;background:var(--bg);color:var(--ink);text-align:center}
button{margin-top:14px;width:100%;font-size:17px;font-weight:700;padding:12px;border:0;border-radius:12px;background:var(--ac);color:#fff}
.err{color:#c0392b;min-height:1.4em;font-size:14px;margin-top:10px}
#wait{display:none;position:fixed;inset:0;background:#fff3d6;color:#3b2f2a;text-align:center}
#wait img{width:36vw;max-width:220px;height:auto;margin-top:calc(40vh - min(18vw,110px));border-radius:22%}
#wait b{display:block;font-size:min(6.5vw,30px);margin-top:min(5vw,28px)}
#wait small{display:block;color:#8a7a70;font-size:14px;margin-top:14px}
</style></head><body>
<div class="box" id="box">
  <img src="apple-touch-icon.png" alt="">
  <h1>家族の年表</h1>
  <p>合言葉を入れてください（次からは入力しなくて大丈夫です）</p>
  <form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="合言葉" autofocus>
  <button type="submit">ひらく</button></form>
  <div class="err" id="err"></div>
</div>
<div id="wait"><img src="icon-512.png" alt=""><b>家族の年表</b><small>読み込んでいます…</small></div>
<script>
const SALT="5fff41e345eff021486e5c668ea36b41", ITER=200000, KID="15d442af4e600198", LS="nenpyo_family_key";
const hex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))), unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.normalize("NFKC").trim()),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:hex(SALT),iterations:ITER},base,256);
}
async function open(raw){
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"]);
  const b=await (await fetch("app.bin",{cache:"no-cache"})).arrayBuffer();
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(b,0,12)},k,new Uint8Array(b,12)));
  window.__NK=k;
  document.open(); document.write(html); document.close();
}
function busy(on){ document.getElementById("box").style.display=on?"none":""; document.getElementById("wait").style.display=on?"block":"none"; }
(async()=>{
  try{ const v=JSON.parse(localStorage.getItem(LS)||"null"); if(v&&v.kid===KID){ busy(true); await open(unb64(v.k)); return; } }catch(e){ busy(false); }
})();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault(); const err=document.getElementById("err"); err.textContent="";
  const pw=document.getElementById("pw").value; if(!pw) return;
  busy(true);
  try{ const raw=await derive(pw); await open(raw);
       try{ localStorage.setItem(LS,JSON.stringify({kid:KID,k:b64(raw)})); }catch(e){} }
  catch(e){ busy(false); err.textContent="合言葉がちがうようです。もう一度入れてください。"; }
});
</script>
</body></html>
